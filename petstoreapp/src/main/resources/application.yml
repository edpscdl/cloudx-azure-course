petstore:
  service:
    pet:
      url: ${PETSTOREPETSERVICE_URL:http://localhost:8081}
    product:
      url: ${PETSTOREPRODUCTSERVICE_URL:http://localhost:8082}
    order:
      url: ${PETSTOREORDERSERVICE_URL:http://localhost:8083}
      reserver:
        url: ${ORDERITEMSRESERVER_URL:http://localhost:8084}
  security:
    # Enable this together with 'cloud.azure.active-directory.b2c.enabled = true' in Module 10
    enabled: ${PETSTORE_SECURITY_ENABLED:false}
server:
  port: ${PETSTOREAPP_SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    ssl:
      enabled: false
    diskspace:
      enabled: false
    applicationinsights:
      enabled: false
    security:
      enabled: false
spring:
  application:
    name: petstoreapp
  thymeleaf:
    cache: false
  cache:
    cache-names: currentUsers
  cloud:
    azure:
      active-directory:
        b2c:
          enabled: ${PETSTOREAPP_B2C_ENABLED:false}
          base-uri: ${PETSTORE_B2C_BASE_URI}
          credential:
            client-id: ${PETSTORE_B2C_CLIENT_ID}
            client-secret: ${PETSTORE_B2C_CLIENT_SECRET}
          login-flow: sign-up-or-sign-in
          logout-success-url: ${PETSTORE_B2C_LOGOUT_SUCCESS_URL}
          user-flows:
            sign-up-or-sign-in: ${PETSTORE_B2C_USERFLOW_SIGNUP_SIGNIN:B2C_1_SIGNUP_OR_SIGNIN}
            password-reset: ${PETSTORE_B2C_USERFLOW_PASSWORD_RESET:B2C_1_PASSWORD_RESET}
            profile-editing: ${PETSTORE_B2C_USERFLOW_PROFILE_EDITING:B2C_1_PROFILE_EDITING}
          reply-url: ${PETSTORE_B2C_REPLY_URL}
